<svg class="fsvg" viewBox="0 0 480 400" role="img" aria-label="The three stages of RLHF" style="--fw:480px"><defs><marker id="rlhf-m" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="rlhf-a" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker><marker id="rlhf-c2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c2"/></marker><marker id="rlhf-c3" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c3"/></marker><marker id="rlhf-c4" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c4"/></marker><marker id="rlhf-c5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c5"/></marker></defs><rect x="20.0" y="10.0" width="440.0" height="60.0" rx="12" class="bacc"/><text x="240.0" y="31.0" dy="0.35em" text-anchor="middle" class="b">1 · Supervised fine-tuning</text><text x="240.0" y="51.0" dy="0.35em" text-anchor="middle" class="sm mut">train on human-written demonstrations → π_SFT</text><rect x="20.0" y="100.0" width="440.0" height="110.0" rx="12" class="pnl"/><text x="240.0" y="120.0" dy="0.35em" text-anchor="middle" class="b">2 · Reward model</text><rect x="36.0" y="140.0" width="90.0" height="40.0" rx="8" class="box"/><text x="81.0" y="160.0" dy="0.35em" text-anchor="middle" class="sm">prompt x</text><rect x="146.0" y="140.0" width="120.0" height="40.0" rx="8" class="box"/><text x="206.0" y="160.0" dy="0.35em" text-anchor="middle" class="sm">y_w ≻ y_l</text><rect x="286.0" y="140.0" width="158.0" height="40.0" rx="8" class="b2"/><text x="365.0" y="160.0" dy="0.35em" text-anchor="middle" class="sm">train r_φ(x, y)</text><line x1="126.0" y1="160.0" x2="144.0" y2="160.0" class="ln" marker-end="url(#rlhf-m)"/><line x1="266.0" y1="160.0" x2="284.0" y2="160.0" class="ln" marker-end="url(#rlhf-m)"/><text x="206.0" y="196.0" dy="0.35em" text-anchor="middle" class="xs mut">humans compare two responses</text><rect x="20.0" y="240.0" width="440.0" height="150.0" rx="12" class="pnl"/><text x="240.0" y="260.0" dy="0.35em" text-anchor="middle" class="b">3 · RL fine-tuning (PPO)</text><rect x="40.0" y="286.0" width="120.0" height="46.0" rx="8" class="bacc"/><text x="100.0" y="300.0" dy="0.35em" text-anchor="middle" class="sm">policy π_θ</text><text x="100.0" y="320.0" dy="0.35em" text-anchor="middle" class="sm mut">generates y</text><rect x="320.0" y="286.0" width="120.0" height="46.0" rx="8" class="b2"/><text x="380.0" y="300.0" dy="0.35em" text-anchor="middle" class="sm">r_φ(x, y)</text><text x="380.0" y="320.0" dy="0.35em" text-anchor="middle" class="sm mut">scores y</text><rect x="170.0" y="342.0" width="140.0" height="40.0" rx="8" class="b5"/><text x="240.0" y="362.0" dy="0.35em" text-anchor="middle" class="sm">reward − β·KL</text><line x1="160.0" y1="300.0" x2="318.0" y2="300.0" class="ln" marker-end="url(#rlhf-m)"/><path d="M380,332 L380,362 L312,362" class="ln" marker-end="url(#rlhf-m)"/><path d="M168,362 L100,362 L100,334" class="lna" marker-end="url(#rlhf-a)"/><text x="240.0" y="290.0" dy="0.35em" text-anchor="middle" class="xs mut">response</text><text x="118.0" y="378.0" dy="0.35em" text-anchor="middle" class="xs acc">PPO update</text><line x1="240.0" y1="70.0" x2="240.0" y2="98.0" class="ln" marker-end="url(#rlhf-m)"/><line x1="240.0" y1="210.0" x2="240.0" y2="238.0" class="ln" marker-end="url(#rlhf-m)"/></svg>