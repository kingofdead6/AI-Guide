<svg class="fsvg" viewBox="0 0 520 290" role="img" aria-label="The GPU memory hierarchy: small and fast at the top, large and slow at the bottom" style="--fw:520px"><defs><marker id="gpu_mem-m" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="gpu_mem-a" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker><marker id="gpu_mem-c2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c2"/></marker><marker id="gpu_mem-c3" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c3"/></marker><marker id="gpu_mem-c4" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c4"/></marker><marker id="gpu_mem-c5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c5"/></marker></defs><polygon points="152.0,14.0 192.0,14.0 229.5,74.0 114.5,74.0" class="b5"/><text x="172.0" y="46.0" dy="0.35em" text-anchor="middle" class="xs b">Reg.</text><text x="241.5" y="46.0" dy="0.35em" text-anchor="start" class="xs mut">registers: per thread, fastest</text><polygon points="114.5,80.0 229.5,80.0 267.0,140.0 77.0,140.0" class="b2"/><text x="172.0" y="112.0" dy="0.35em" text-anchor="middle" class="xs b">SRAM (shared / L1)</text><text x="279.0" y="112.0" dy="0.35em" text-anchor="start" class="xs mut">~tens of MB total, ~10+ TB/s</text><polygon points="77.0,146.0 267.0,146.0 304.5,206.0 39.5,206.0" class="bacc"/><text x="172.0" y="178.0" dy="0.35em" text-anchor="middle" class="xs b">HBM (GPU memory)</text><text x="316.5" y="178.0" dy="0.35em" text-anchor="start" class="xs mut">~80–200 GB, a few TB/s</text><polygon points="39.5,212.0 304.5,212.0 342.0,272.0 2.0,272.0" class="b4"/><text x="172.0" y="244.0" dy="0.35em" text-anchor="middle" class="xs b">CPU RAM / NVMe</text><text x="354.0" y="244.0" dy="0.35em" text-anchor="start" class="xs mut">TBs, 10–100× slower</text></svg>