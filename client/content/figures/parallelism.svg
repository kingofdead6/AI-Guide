<svg class="fsvg" viewBox="0 0 500 490" role="img" aria-label="Data, tensor and pipeline parallelism" style="--fw:500px"><defs><marker id="parallelism-m" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="parallelism-a" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker><marker id="parallelism-c2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c2"/></marker><marker id="parallelism-c3" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c3"/></marker><marker id="parallelism-c4" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c4"/></marker><marker id="parallelism-c5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c5"/></marker></defs><text x="250.0" y="16.0" dy="0.35em" text-anchor="middle" class="sm b">Data parallel: full model copy per GPU, split the batch</text><rect x="30.0" y="32.0" width="130.0" height="54.0" rx="8" class="bacc"/><text x="95.0" y="50.0" dy="0.35em" text-anchor="middle" class="sm">GPU 0: model</text><text x="95.0" y="70.0" dy="0.35em" text-anchor="middle" class="sm mut">batch shard 0</text><rect x="190.0" y="32.0" width="130.0" height="54.0" rx="8" class="bacc"/><text x="255.0" y="50.0" dy="0.35em" text-anchor="middle" class="sm">GPU 1: model</text><text x="255.0" y="70.0" dy="0.35em" text-anchor="middle"