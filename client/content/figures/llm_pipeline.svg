<svg class="fsvg" viewBox="0 0 440 448" role="img" aria-label="How a chat LLM is made" style="--fw:440px"><defs><marker id="llm_pipeline-m" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="llm_pipeline-a" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker><marker id="llm_pipeline-c2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c2"/></marker><marker id="llm_pipeline-c3" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c3"/></marker><marker id="llm_pipeline-c4" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c4"/></marker><marker id="llm_pipeline-c5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c5"/></marker></defs><rect x="60.0" y="10.0" width="320.0" height="46.0" rx="10" class="b2"/><text x="220.0" y="24.0" dy="0.35em" text-anchor="middle">Web-scale text and code</text><text x="220.0" y="44.0" dy="0.35em" text-anchor="middle" class="sm mut">trillions of tokens, filtered and deduplicated</text><line x1="220.0" y1="56.0" x2="220.0" y2="80.0" class="ln" marker-end="url(#llm_pipeline-m)"/><rect x="60.0" y="82.0" width="320.0" height="46.0" rx="10" class="bacc"/><text x="220.0" y="96.0" dy="0.35em" text-anchor="middle" class="sm">Pretraining: next-token prediction</text><text x="220.0" y="116.0" dy="0.35em" text-anchor="middle" class="sm mut">weeks on thousands of GPUs</text><line x1="220.0" y1="128.0" x2="220.0" y2="152.0" class="ln" marker-end="url(#llm_pipeline-m)"/><rect x="60.0" y="154.0" width="320.0" height="46.0" rx="10" class="box"/><text x="220.0" y="168.0" dy="0.35em" text-anchor="middle">Base model</text><text x="220.0" y="188.0" dy="0.35em" text-anchor="middle" class="sm mut">knows a lot, follows instructions poorly</text><line x1="220.0" y1="200.0" x2="220.0" y2="224.0" class="ln" marker-end="url(#llm_pipeline-m)"/><rect x="60.0" y="226.0" width="320.0" height="46.0" rx="10" class="bacc"/><text x="220.0" y="240.0" dy="0.35em" text-anchor="middle">Supervised fine-tuning (SFT)</text><text x="220.0" y="260.0" dy="0.35em" text-anchor="middle" class="sm mut">curated instruction → response examples</text><line x1="220.0" y1="272.0" x2="220.0" y2="296.0" class="ln" marker-end="url(#llm_pipeline-m)"/><rect x="60.0" y="298.0" width="320.0" height="46.0" rx="10" class="bacc"/><text x="220.0" y="312.0" dy="0.35em" text-anchor="middle">Preference tuning and RL</text><text x="220.0" y="332.0" dy="0.35em" text-anchor="middle" class="sm mut">RLHF, DPO, RL with verifiable rewards</text><line x1="220.0" y1="344.0" x2="220.0" y2="368.0" class="ln" marker-end="url(#llm_pipeline-m)"/><rect x="60.0" y="370.0" width="320.0" height="46.0" rx="10" class="b3"/><text x="220.0" y="384.0" dy="0.35em" text-anchor="middle">Assistant model</text><text x="220.0" y="404.0" dy="0.35em" text-anchor="middle" class="sm mut">helpful, honest, safer, better at reasoning</text></svg>