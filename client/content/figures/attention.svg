<svg class="fsvg" viewBox="0 0 460 480" role="img" aria-label="Scaled dot-product attention, step by step" style="--fw:460px"><defs><marker id="attention-m" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="attention-a" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker><marker id="attention-c2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c2"/></marker><marker id="attention-c3" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c3"/></marker><marker id="attention-c4" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c4"/></marker><marker id="attention-c5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c5"/></marker></defs><rect x="155.0" y="14.0" width="150.0" height="40.0" rx="10" class="b2"/><text x="230.0" y="34.0" dy="0.35em" text-anchor="middle">X  (n × d)</text><rect x="20.0" y="92.0" width="120.0" height="44.0" rx="10" class="bacc"/><text x="80.0" y="114.0" dy="0.35em" text-anchor="middle" class="sm">Q = X W_Q</text><line x1="230.0" y1="54.0" x2="80.0" y2="90.0" class="ln" marker-end="url(#attention-m)"/><rect x="170.0" y="92.0" width="120.0" height="44.0" rx="10" class="bacc"/><text x="230.0" y="114.0" dy="0.35em" text-anchor="middle" class="sm">K = X W_K</text><line x1="230.0" y1="54.0" x2="230.0" y2="90.0" class="ln" marker-end="url(#attention-m)"/><rect x="320.0" y="92.0" width="120.0" height="44.0" rx="10" class="bacc"/><text x="380.0" y="114.0" dy="0.35em" text-anchor="middle" class="sm">V = X W_V</text><line x1="230.0" y1="54.0" x2="380.0" y2="90.0" class="ln" marker-end="url(#attention-m)"/><rect x="40.0" y="172.0" width="250.0" height="46.0" rx="10" class="box"/><text x="165.0" y="186.0" dy="0.35em" text-anchor="middle">S = Q Kᵀ / √d_k</text><text x="165.0" y="206.0" dy="0.35em" text-anchor="middle" class="sm mut">n × n similarity scores</text><line x1="80.0" y1="136.0" x2="110.0" y2="170.0" class="ln" marker-end="url(#attention-m)"/><line x1="230.0" y1="136.0" x2="210.0" y2="170.0" class="ln" marker-end="url(#attention-m)"/><rect x="40.0" y="248.0" width="250.0" height="44.0" rx="10" class="box"/><text x="165.0" y="270.0" dy="0.35em" text-anchor="middle">S + M  (causal mask)</text><rect x="40.0" y="322.0" width="250.0" height="46.0" rx="10" class="box"/><text x="165.0" y="336.0" dy="0.35em" text-anchor="middle">A = softmax(S), row-wise</text><text x="165.0" y="356.0" dy="0.35em" text-anchor="middle" class="sm mut">each row sums to 1</text><rect x="40.0" y="400.0" width="250.0" height="46.0" rx="10" class="b3"/><text x="165.0" y="414.0" dy="0.35em" text-anchor="middle">Output = A V</text><text x="165.0" y="434.0" dy="0.35em" text-anchor="middle" class="sm mut">n × d_v</text><line x1="165.0" y1="218.0" x2="165.0" y2="246.0" class="ln" marker-end="url(#attention-m)"/><line x1="165.0" y1="292.0" x2="165.0" y2="320.0" class="ln" marker-end="url(#attention-m)"/><line x1="165.0" y1="368.0" x2="165.0" y2="398.0" class="ln" marker-end="url(#attention-m)"/><path d="M380,136 L380,423 L292,423" class="ln" marker-end="url(#attention-m)"/><text x="392.0" y="280.0" dy="0.35em" text-anchor="start" class="xs mut">values</text></svg>