<svg class="fsvg" viewBox="0 0 460 492" role="img" aria-label="Request path of a production LLM application" style="--fw:460px"><defs><marker id="llmops-m" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="llmops-a" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker><marker id="llmops-c2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c2"/></marker><marker id="llmops-c3" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c3"/></marker><marker id="llmops-c4" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c4"/></marker><marker id="llmops-c5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c5"/></marker></defs><rect x="50.0" y="10.0" width="360.0" height="46.0" rx="10" class="b2"/><text x="230.0" y="24.0" dy="0.35em" text-anchor="middle">Request</text><text x="230.0" y="44.0" dy="0.35em" text-anchor="middle" class="sm mut">auth, rate limits, input validation</text><line x1="230.0" y1="56.0" x2="230.0" y2="76.0" class="ln" marker-end="url(#llmops-m)"/><rect x="50.0" y="78.0" width="360.0" height="46.0" rx="10" class="box"/><text x="230.0" y="92.0" dy="0.35em" text-anchor="middle">Cache lookup</text><text x="230.0" y="112.0" dy="0.35em" text-anchor="middle" class="sm mut">exact or semantic cache hit → return early</text><line x1="230.0" y1="124.0" x2="230.0" y2="144.0" class="ln" marker-end="url(#llmops-m)"/><rect x="50.0" y="146.0" width="360.0" height="46.0" rx="10" class="bacc"/><text x="230.0" y="160.0" dy="0.35em" text-anchor="middle">Router</text><text x="230.0" y="180.0" dy="0.35em" text-anchor="middle" class="sm mut">small model for easy, large model for hard</text><line x1="230.0" y1="192.0" x2="230.0" y2="212.0" class="ln" marker-end="url(#llmops-m)"/><rect x="50.0" y="214.0" width="360.0" height="46.0" rx="10" class="box"/><text x="230.0" y="228.0" dy="0.35em" text-anchor="middle">Context assembly</text><text x="230.0" y="248.0" dy="0.35em" text-anchor="middle" class="sm mut">system prompt + retrieved docs + history</text><line x1="230.0" y1="260.0" x2="230.0" y2="280.0" class="ln" marker-end="url(#llmops-m)"/><rect x="50.0" y="282.0" width="360.0" height="46.0" rx="10" class="b4"/><text x="230.0" y="296.0" dy="0.35em" text-anchor="middle">LLM call</text><text x="230.0" y="316.0" dy="0.35em" text-anchor="middle" class="sm mut">streaming, timeouts, retries, fallbacks</text><line x1="230.0" y1="328.0" x2="230.0" y2="348.0" class="ln" marker-end="url(#llmops-m)"/><rect x="50.0" y="350.0" width="360.0" height="46.0" rx="10" class="b5"/><text x="230.0" y="364.0" dy="0.35em" text-anchor="middle">Output checks</text><text x="230.0" y="384.0" dy="0.35em" text-anchor="middle" class="sm mut">schema validation, guardrails, citations</text><line x1="230.0" y1="396.0" x2="230.0" y2="416.0" class="ln" marker-end="url(#llmops-m)"/><rect x="50.0" y="418.0" width="360.0" height="46.0" rx="10" class="b3"/><text x="230.0" y="432.0" dy="0.35em" text-anchor="middle">Response + logging</text><text x="230.0" y="452.0" dy="0.35em" text-anchor="middle" class="sm mut">traces, cost, latency, user feedback → evals</text></svg>