<svg class="fsvg" viewBox="0 0 520 500" role="img" aria-label="Forward and backward pass through a two-layer network" style="--fw:520px"><defs><marker id="backprop_flow-m" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-m"/></marker><marker id="backprop_flow-a" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker><marker id="backprop_flow-c2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c2"/></marker><marker id="backprop_flow-c3" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c3"/></marker><marker id="backprop_flow-c4" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c4"/></marker><marker id="backprop_flow-c5" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c5"/></marker></defs><rect x="30.0" y="18.0" width="260.0" height="50.0" rx="10" class="box"/><text x="160.0" y="43.0" dy="0.35em" text-anchor="middle">Input x</text><rect x="30.0" y="98.0" width="260.0" height="50.0" rx="10" class="bacc"/><text x="160.0" y="114.0" dy="0.35em" text-anchor="middle">Linear: z₁ = W₁x + b₁</text><text x="160.0" y="134.0" dy="0.35em" text-anchor="middle" class="sm tc5">∂L/∂W₁ = δ₁ xᵀ</text><rect x="30.0" y="178.0" width="260.0" height="50.0" rx="10" class="box"/><text x="160.0" y="203.0" dy="0.35em" text-anchor="middle">ReLU: h = max(0, z₁)</text><rect x="30.0" y="258.0" width="260.0" height="50.0" rx="10" class="bacc"/><text x="160.0" y="274.0" dy="0.35em" text-anchor="middle">Linear: z₂ = W₂h + b₂</text><text x="160.0" y="294.0" dy="0.35em" text-anchor="middle" class="sm tc5">∂L/∂W₂ = δ₂ hᵀ</text><rect x="30.0" y="338.0" width="260.0" height="50.0" rx="10" class="box"/><text x="160.0" y="363.0" dy="0.35em" text-anchor="middle">Softmax: p = softmax(z₂)</text><rect x="30.0" y="418.0" width="260.0" height="50.0" rx="10" class="b5"/><text x="160.0" y="443.0" dy="0.35em" text-anchor="middle">Loss: L = −log p_y</text><line x1="70.0" y1="68.0" x2="70.0" y2="98.0" class="lna" marker-end="url(#backprop_flow-a)"/><line x1="250.0" y1="98.0" x2="250.0" y2="68.0" class="lc5" marker-end="url(#backprop_flow-c5)"/><text x="305.0" y="83.0" dy="0.35em" text-anchor="start" class="sm tc5">∂L/∂x = W₁ᵀδ₁</text><line x1="70.0" y1="148.0" x2="70.0" y2="178.0" class="lna" marker-end="url(#backprop_flow-a)"/><line x1="250.0" y1="178.0" x2="250.0" y2="148.0" class="lc5" marker-end="url(#backprop_flow-c5)"/><text x="305.0" y="163.0" dy="0.35em" text-anchor="start" class="sm tc5">δ₁ = (W₂ᵀδ₂) ⊙ 1[z₁ &gt; 0]</text><line x1="70.0" y1="228.0" x2="70.0" y2="258.0" class="lna" marker-end="url(#backprop_flow-a)"/><line x1="250.0" y1="258.0" x2="250.0" y2="228.0" class="lc5" marker-end="url(#backprop_flow-c5)"/><text x="305.0" y="243.0" dy="0.35em" text-anchor="start" class="sm tc5">∂L/∂h = W₂ᵀδ₂</text><line x1="70.0" y1="308.0" x2="70.0" y2="338.0" class="lna" marker-end="url(#backprop_flow-a)"/><line x1="250.0" y1="338.0" x2="250.0" y2="308.0" class="lc5" marker-end="url(#backprop_flow-c5)"/><text x="305.0" y="323.0" dy="0.35em" text-anchor="start" class="sm tc5">δ₂ = p − y</text><line x1="70.0" y1="388.0" x2="70.0" y2="418.0" class="lna" marker-end="url(#backprop_flow-a)"/><line x1="250.0" y1="418.0" x2="250.0" y2="388.0" class="lc5" marker-end="url(#backprop_flow-c5)"/><text x="305.0" y="403.0" dy="0.35em" text-anchor="start" class="sm tc5">∂L/∂L = 1</text><text x="305.0" y="26.0" dy="0.35em" text-anchor="start" class="sm acc">↓ forward pass</text><text x="305.0" y="46.0" dy="0.35em" text-anchor="start" class="sm tc5">↑ backward pass</text></svg>