<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free, self-paced courses to become an AI engineer: math, machine learning, deep learning, LLMs, RAG, agents and systems, with graded quizzes, code exercises and certificates." />
    <meta name="theme-color" content="#f6f6fa" />
    <title>The AI Guide Academy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235145e5'/%3E%3Ccircle cx='10' cy='11' r='3' fill='white'/%3E%3Ccircle cx='10' cy='21' r='3' fill='white'/%3E%3Ccircle cx='22' cy='16' r='3.5' fill='%23f5a84a'/%3E%3Cpath d='M12.6 12.2 19 15M12.6 19.8 19 17' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('aiguide-progress') || '{}').state || {};
        var t = s.theme || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Apply the saved colour theme, fonts and motion settings (see src/lib/appearance.ts).
      try {
        var b = JSON.parse(localStorage.getItem('aiguide-appearance-boot') || 'null');
        if (b) {
          var r = document.documentElement;
          if (b.palette) r.setAttribute('data-palette', b.palette);
          if (b.css) {
            var st = document.createElement('style');
            st.id = 'theme-css';
            st.textContent = b.css;
            document.head.appendChild(st);
          }
          for (var k in b.vars) r.style.setProperty(k, b.vars[k]);
          for (var c in b.classes) if (b.classes[c]) r.classList.add(c);
          if (b.fonts) {
            var l = document.createElement('link');
            l.id = 'user-fonts';
            l.rel = 'stylesheet';
            l.href = b.fonts;
            document.head.appendChild(l);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
